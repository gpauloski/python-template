[tox]
requires = tox-uv-bare>=1
envlist = py310, py311, py312, py313, prek, docs

[testenv]
# Opt in to the uv-backed runner: it builds the environment from uv.lock,
# reusing uv's global cache for fast, reproducible installs.
runner = uv-venv-lock-runner
dependency_groups = dev
commands =
    coverage erase
    coverage run -m pytest {posargs}
    coverage report

[testenv:prek]
runner = uv-venv-lock-runner
dependency_groups = dev
commands = prek run --all-files --show-diff-on-failure

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = docs
commands = mkdocs build --strict
