name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token needed:
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
      # Required for mike to push the docs to the gh-pages branch.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          # Removes 'v' prefix from tag (e.g. v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted version from tag: $VERSION"

      - name: Check package version is PEP440 compliant
        # This is only a partial PEP440 match, it just checks the major, minor
        # patch, but not any optional suffixes.
        run: echo "${{ env.PACKAGE_VERSION }}" | grep -P "^\d+\.\d+\.\d+.*$"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        # Trusted Publishing: configure a pending publisher on PyPI pointing at
        # this workflow. Falls back to a token via `with: password: ...`.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Configure git
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for release version to gh-pages branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv sync --group docs
          uv run mike deploy --push --update-aliases "${{ env.PACKAGE_VERSION }}" latest
