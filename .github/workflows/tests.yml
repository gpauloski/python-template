name: tests

on:
  push:
    branches: [main, test-me-*]
    tags:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.10'
          toxenv: py310
        - os: ubuntu-latest
          python: '3.11'
          toxenv: py311
        - os: ubuntu-latest
          python: '3.12'
          toxenv: py312
        - os: ubuntu-latest
          python: '3.13'
          toxenv: py313
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Cache the interpreter download in addition to the package cache.
          cache-python: true
          # Sets UV_PYTHON, which takes precedence over .python-version. This
          # keeps the tox driver environment on the same interpreter as the
          # environment under test, so each job provisions only one Python.
          python-version: ${{ matrix.python }}

      - name: Run tox
        run: uv run tox -e ${{ matrix.toxenv }}
