name: prek

on:
  push:
    branches: [main, test-me-*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true

      - name: Install the project
        run: uv sync

      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure
