name: prek-autoupdate

# Weekly refresh of pinned hook versions in .pre-commit-config.yaml. Runs
# `prek autoupdate` and opens a pull request if anything changed. Replaces the
# autoupdate service that pre-commit.ci provided.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true

      - name: Install the project
        run: uv sync

      # The diff makes runs self-documenting: when no hooks changed the next
      # step is a no-op ("Branch ... is not ahead of base") and the log would
      # otherwise give no indication of why no pull request was opened.
      - name: Run prek autoupdate
        run: |
          uv run prek autoupdate
          git --no-pager diff -- .pre-commit-config.yaml

      # Requires "Allow GitHub Actions to create and approve pull requests"
      # under Settings > Actions > General (and the same setting at the org
      # level, if the repo belongs to one). Without it this step fails with
      # "GitHub Actions is not permitted to create or approve pull requests".
      # Note that pull requests opened with the default GITHUB_TOKEN do not
      # trigger other workflows; pass `token:` a PAT if the autoupdate PR
      # should run the tests and prek workflows.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "[prek] autoupdate hooks"
          title: "[prek] autoupdate hooks"
          body: >
            Automated weekly update of pre-commit hook versions via
            `prek autoupdate`.
          branch: prek-autoupdate
          delete-branch: true
          labels: dependencies
